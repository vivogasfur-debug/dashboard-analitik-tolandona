<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    /* Gradien Warna */
    .bg-main { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .bg-male { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; }
    .bg-female { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); color: white; }

    .stat-card {
      border: none;
      border-radius: 20px;
      transition: 0.3s;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    .stat-card:hover { transform: translateY(-10px); }

    /* Glassmorphism Table */
    .glass-container {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(15px);
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 25px;
      margin-top: 30px;
    }

    .table-custom { border-collapse: separate; border-spacing: 0 8px; }
    .table-custom thead th { background: #764ba2; color: white; border: none; padding: 15px; }
    .table-custom tbody tr { background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .table-custom td { padding: 15px; border: none; }
    .first-td { border-radius: 12px 0 0 12px; }
    .last-td { border-radius: 0 12px 12px 0; }
  </style>
</head>
<body>

<div class="container py-5">
  <div class="text-center mb-5">
    <h1 class="fw-bold">📊 Masterpiece Dashboard</h1>
    <p class="text-secondary">Monitoring Data PM Tolandona</p>
    
    <div class="d-flex justify-content-center mt-3">
      <select id="kategori" class="form-select w-25 shadow-sm" onchange="loadData()">
        <option value="Siswa">Siswa</option>
        <option value="Guru">Guru</option>
        <option value="Posyandu">Posyandu</option>
      </select>
    </div>
  </div>

  <div class="row g-4 mb-5 text-center">
    <div class="col-md-4">
      <div class="card stat-card bg-main p-4">
        <h5>Total Data</h5>
        <h2 id="txtTotal">0</h2>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card stat-card bg-male p-4">
        <h5>Laki-Laki (L)</h5>
        <h2 id="txtL">0</h2>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card stat-card bg-female p-4">
        <h5>Perempuan (P)</h5>
        <h2 id="txtP">0</h2>
      </div>
    </div>
  </div>

  <div class="glass-container">
    <h4 class="fw-bold mb-3">📋 Detail Data Transparan</h4>
    <div class="table-responsive">
      <table class="table table-custom">
        <thead id="headTabel"></thead>
        <tbody id="bodyTabel"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  window.onload = loadData;

  function loadData() {
    const kat = document.getElementById('kategori').value;
    google.script.run.withSuccessHandler(showData).getDatabaseData(kat);
  }

  function showData(res) {
    document.getElementById('txtTotal').innerText = res.total;
    document.getElementById('txtL').innerText = res.male;
    document.getElementById('txtP').innerText = res.female;

    // Isi Header Tabel
    const head = document.getElementById('headTabel');
    head.innerHTML = `<tr>${res.headers.map(h => `<th>${h}</th>`).join('')}</tr>`;

    // Isi Body Tabel
    const body = document.getElementById('bodyTabel');
    body.innerHTML = res.rows.map(row => {
      return `<tr>${row.map((cell, i) => {
        let cls = i === 0 ? 'first-td' : (i === row.length-1 ? 'last-td' : '');
        return `<td class="${cls}">${cell}</td>`;
      }).join('')}</tr>`;
    }).join('');
  }
</script>

</body>
</html>
